services:

  backend:
    image: discuzz-backend
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

    env_file:
      - server/.env
    
    depends_on:
      mysql:
        condition: service_healthy
  
  frontend:
    image: discuzz-frontend
    build:
      context: ./client
      dockerfile: Dockerfile
      
    env_file:
      - client/.env

    ports:
      - "5173:5173"

    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    env_file:
      - .env
    ports:
      - "3306:3306"

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
